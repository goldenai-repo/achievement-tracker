name: iosApp
options:
  bundleIdPrefix: com.goldenai
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    # GitLive firebase-kotlin-sdk 2.5.0 is built against Firebase iOS 11.8
    from: 11.8.0

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    dependencies:
      - package: Firebase
        products:
          - FirebaseAuth
          - FirebaseFirestore
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Achievements
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Required by Compose Multiplatform for correct frame pacing on ProMotion displays
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenai.achievements
        # Compose Multiplatform 1.11+ no longer supports Intel (x86_64) simulators
        "ARCHS[sdk=iphonesimulator*]": arm64
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        # -lsqlite3 is required by SQLDelight's native driver inside the
        # static ComposeApp framework
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp -lsqlite3"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME="$(/usr/libexec/java_home 2>/dev/null || true)"
          fi
          if [ ! -x "$JAVA_HOME/bin/java" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
